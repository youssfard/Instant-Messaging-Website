<!DOCTYPE html>
<html>
<head>
	<link rel = "stylesheet" href="../css/registerstyle.css">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
	<div class="page">
		<form id="form" class="register_form" enctype="multipart/form-data">
			<img src="../images/default.png" id="avatar" class="avatar" height=120 width=120>
				<input type="file" id="image" name="image" hidden>
				<input name="name" placeholder="Name and surname">
				<input name="email" placeholder="Email">
				<input name="username" placeholder="Username">
				<input name="password" type="password" placeholder="Password">
				<button type ="submit" class="sign_btn"> Sign up! </button>
		</form>
	</div>
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
	<script src="../javascript/register.js"></script>
</body>
</html>
